GLOBAL capsicainonoffkey SCRLOCK
#GLOBAL startintraybar
GLOBAL ActiveConfigOnStartup 1

[CONFIG_1]
OPTION ConfigName Alt cursor navigation

# ============================================================
# CapsLock: tap alone = Esc, hold with other keys = LCtrl
# ============================================================
REWIRE CAPS LCTRL ESC

# ============================================================
# LAlt is rewired to virtual MOD9.
# This prevents LAlt from reaching applications directly,
# so Alt+HJKL etc won't trigger app shortcuts.
# ============================================================
REWIRE LALT MOD9 NOP

# ============================================================
# LShift + RShift = CapsLock toggle (either order)
# ============================================================
COMBO LSHF [.... .... ...& ....] > key(CAPS)
COMBO RSHF [.... .... .... ...&] > key(CAPS)

# ============================================================
# LAlt + Tab = native Alt+Tab window switching
# ============================================================
COMBO TAB [.... ...& .... ....] > alttab()

# ============================================================
# ===== ORDER MATTERS: more specific combos MUST come first =====
# ============================================================

# ----------------------------------------------------------
# Alt+Shift+HJKLUDIA = SELECT text (Shift+Arrow/Home/End/PgUp/PgDown)
# ----------------------------------------------------------
COMBO H [.... ...& .... ...&] > key(LEFT)
COMBO J [.... ...& .... ...&] > key(DOWN)
COMBO K [.... ...& .... ...&] > key(UP)
COMBO L [.... ...& .... ...&] > key(RIGHT)
COMBO I [.... ...& .... ...&] > key(HOME)
COMBO A [.... ...& .... ...&] > key(END)
COMBO U [.... ...& .... ...&] > key(PGUP)
COMBO D [.... ...& .... ...&] > key(PGDOWN)

# ----------------------------------------------------------
# Alt+CapsLock+HL = move by WORD (Ctrl+Left / Ctrl+Right)
# CapsLock is rewired to LCTRL when held
# ----------------------------------------------------------
COMBO H [.... ...& .... ..&.] > moddedKey(LEFT + .... .... .... ..&.)
COMBO L [.... ...& .... ..&.] > moddedKey(RIGHT + .... .... .... ..&.)

# ----------------------------------------------------------
# Alt+HJKLUDIA = basic cursor movement (Arrow/Home/End/PgUp/PgDown)
# ----------------------------------------------------------
COMBO H [.... ...& .... ....] > moddedKey(LEFT + .... .... .... ....)
COMBO J [.... ...& .... ....] > moddedKey(DOWN + .... .... .... ....)
COMBO K [.... ...& .... ....] > moddedKey(UP + .... .... .... ....)
COMBO L [.... ...& .... ....] > moddedKey(RIGHT + .... .... .... ....)
COMBO I [.... ...& .... ....] > moddedKey(HOME + .... .... .... ....)
COMBO A [.... ...& .... ....] > moddedKey(END + .... .... .... ....)
COMBO U [.... ...& .... ....] > moddedKey(PGUP + .... .... .... ....)
COMBO D [.... ...& .... ....] > moddedKey(PGDOWN + .... .... .... ....)